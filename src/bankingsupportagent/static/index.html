<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SecureBank Support</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --panel: #ffffff;
      --text: #1c2430;
      --muted: #667085;
      --brand: #0b4f8a;
      --brand-soft: #e7f0f8;
      --line: #e3e7ee;
      --warn: #fff6e5;
      --warn-line: #f0c36d;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }   /* make the hidden attribute win over display: flex */
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      justify-content: center;
    }
    .app {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }
    header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    header h1 { font-size: 17px; margin: 0; color: var(--brand); flex: 1; }
    #who { font-size: 13px; color: var(--muted); }
    button { font: inherit; font-size: 14px; }
    .secondary {
      padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px;
      background: #fff; cursor: pointer;
    }

    /* Login screen */
    #login-view { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
    #login-form { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 10px; }
    #login-form h2 { margin: 0 0 6px; font-size: 18px; }
    #login-form label { font-size: 13px; color: var(--muted); }
    #login-form input { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; }
    #login-form button { padding: 10px; border: none; border-radius: 8px; background: var(--brand); color: #fff; cursor: pointer; margin-top: 6px; }
    #login-error { color: #b42318; font-size: 13px; min-height: 18px; }
    .demo { font-size: 12px; color: var(--muted); line-height: 1.5; }

    /* Chat screen */
    #chat-view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    #messages { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 82%; padding: 10px 13px; border-radius: 12px; line-height: 1.45; white-space: pre-wrap; font-size: 15px; }
    .user { align-self: flex-end; background: var(--brand); color: #fff; border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: var(--brand-soft); border-bottom-left-radius: 4px; }
    .bot.thinking { color: var(--muted); font-style: italic; }
    .meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .confirm { align-self: flex-start; background: var(--warn); border: 1px solid var(--warn-line); }
    .confirm .actions { margin-top: 10px; display: flex; gap: 8px; }
    .confirm button { padding: 6px 14px; border-radius: 6px; border: 1px solid var(--warn-line); cursor: pointer; background: #fff; }
    .confirm button.yes { background: #b42318; color: #fff; border-color: #b42318; }
    .error { align-self: center; color: #b42318; font-size: 13px; text-align: center; }
    .hint { color: var(--muted); font-size: 13px; text-align: center; margin-top: 30px; }
    #chat-form { display: flex; gap: 8px; padding: 14px 18px; border-top: 1px solid var(--line); }
    #chat-form input { flex: 1; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; }
    #chat-form button { padding: 10px 18px; border: none; border-radius: 8px; background: var(--brand); color: #fff; cursor: pointer; }
    #chat-form button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>SecureBank Support</h1>
      <span id="who"></span>
      <button class="secondary" id="tickets" type="button" hidden>My tickets</button>
      <button class="secondary" id="new-chat" type="button" hidden>New chat</button>
      <button class="secondary" id="logout" type="button" hidden>Log out</button>
    </header>

    <!-- Screen 1: login -->
    <div id="login-view">
      <form id="login-form">
        <h2>Log in</h2>
        <label for="login-id">Customer ID</label>
        <input id="login-id" autocomplete="username" required>
        <label for="login-password">Password</label>
        <input id="login-password" type="password" autocomplete="current-password" required>
        <button type="submit">Log in</button>
        <div id="login-error"></div>
        <div class="demo">Demo logins: C1001 / rahul-demo-123 &nbsp;·&nbsp; C1002 / priya-demo-123</div>
      </form>
    </div>

    <!-- Screen 2: chat (hidden until logged in) -->
    <div id="chat-view" hidden>
      <div id="messages"></div>
      <form id="chat-form">
        <input id="input" autocomplete="off" placeholder="Ask about your account, cards or bank policies..." maxlength="2000">
        <button id="send" type="submit">Send</button>
      </form>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const chatForm = document.getElementById("chat-form");
    const input = document.getElementById("input");
    const sendButton = document.getElementById("send");
    const HINT = 'Try: "What is the FD rate for senior citizens?", "Show my last 3 transactions", or "Freeze my card ending 4821".';

    // The login lives in sessionStorage: a page refresh keeps you logged in and in the same chat,
    // closing the tab forgets everything. (Storage can be blocked, so every access is wrapped.)
    function remember(key, value) {
      try { value === null ? sessionStorage.removeItem(key) : sessionStorage.setItem(key, value); } catch {}
    }
    function recall(key) {
      try { return sessionStorage.getItem(key); } catch { return null; }
    }

    let token = recall("sb_token");
    let customerId = recall("sb_customer");
    let threadId = recall("sb_thread") || crypto.randomUUID();

    // ---------- Talking to the API ----------

    function authHeaders() {
      const headers = { "Content-Type": "application/json" };
      if (token) headers["Authorization"] = `Bearer ${token}`;    // send the token with every request
      return headers;
    }

    async function readJson(response, path) {
      const data = await response.json().catch(() => ({}));
      if (response.status === 401 && path !== "/login") {
        logout("Your session has expired. Please log in again.");
        throw new Error("Please log in again.");
      }
      if (!response.ok) throw new Error(data.detail || "Something went wrong");
      return data;
    }

    async function post(path, body) {
      const response = await fetch(path, { method: "POST", headers: authHeaders(), body: JSON.stringify(body) });
      return readJson(response, path);
    }

    async function get(path) {
      const response = await fetch(path, { headers: authHeaders() });
      return readJson(response, path);
    }

    // Reads the answer as it is written. Calls onToken(text) for each piece and returns the final result.
    async function streamChat(message, onToken) {
      const response = await fetch("/chat/stream", {
        method: "POST", headers: authHeaders(), body: JSON.stringify({ thread_id: threadId, message }),
      });
      if (!response.ok) return readJson(response, "/chat/stream");    // errors before streaming starts are plain JSON

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let end;
        while ((end = buffer.indexOf("\n\n")) !== -1) {
          const block = buffer.slice(0, end);
          buffer = buffer.slice(end + 2);
          const event = /^event: (.*)$/m.exec(block)?.[1];
          const data = JSON.parse(/^data: (.*)$/m.exec(block)?.[1] ?? "{}");
          if (event === "token") onToken(data.text);
          else if (event === "done") return data;
          else if (event === "error") throw new Error(data.detail);
        }
      }
      throw new Error("The connection closed before the answer was complete. Please try again.");
    }

    // ---------- Login and logout ----------

    document.getElementById("login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const id = document.getElementById("login-id").value.trim();
      const password = document.getElementById("login-password").value;
      document.getElementById("login-error").textContent = "";
      try {
        const data = await post("/login", { customer_id: id, password });
        token = data.access_token;
        customerId = id;
        remember("sb_token", token);
        remember("sb_customer", id);
        document.getElementById("login-password").value = "";
        showChat();
        newChat();
      } catch (error) {
        document.getElementById("login-error").textContent = error.message;
      }
    });

    function showChat() {
      document.getElementById("login-view").hidden = true;
      document.getElementById("chat-view").hidden = false;
      for (const id of ["tickets", "new-chat", "logout"]) document.getElementById(id).hidden = false;
      document.getElementById("who").textContent = `Logged in as ${customerId}`;
    }

    function logout(message = "") {
      token = null;
      customerId = null;
      for (const key of ["sb_token", "sb_customer", "sb_thread"]) remember(key, null);
      document.getElementById("login-view").hidden = false;
      document.getElementById("chat-view").hidden = true;
      for (const id of ["tickets", "new-chat", "logout"]) document.getElementById(id).hidden = true;
      document.getElementById("who").textContent = "";
      document.getElementById("login-error").textContent = message;
    }

    document.getElementById("logout").onclick = () => logout();

    // ---------- Showing messages ----------

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function formatReply(text) {
      return escapeHtml(text).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    }

    function scrollDown() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addMessage(text, who, route) {
      const div = document.createElement("div");
      div.className = `msg ${who}`;
      div.innerHTML = who === "user" ? escapeHtml(text) : formatReply(text);
      if (route) addRoute(div, route);
      messagesEl.appendChild(div);
      scrollDown();
      return div;
    }

    function addRoute(div, route) {
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = `handled by: ${route} agent`;
      div.appendChild(meta);
    }

    function addConfirmation(question) {
      const div = addMessage(question, "confirm");
      const actions = document.createElement("div");
      actions.className = "actions";
      actions.innerHTML = '<button class="yes" type="button">Yes, continue</button><button type="button">No</button>';
      div.appendChild(actions);
      const [yes, no] = actions.querySelectorAll("button");
      yes.onclick = () => answerConfirmation(true, actions);
      no.onclick = () => answerConfirmation(false, actions);
      setBusy(true, true);
    }

    function setBusy(busy, waitingForConfirmation = false) {
      sendButton.disabled = busy;
      input.disabled = busy;
      input.placeholder = waitingForConfirmation
        ? "Please answer the question above first"
        : "Ask about your account, cards or bank policies...";
    }

    function showResult(data) {
      if (data.status === "needs_confirmation") {
        addConfirmation(data.reply);
      } else {
        addMessage(data.reply, "bot", data.route);
        setBusy(false);
        input.focus();
      }
    }

    function showError(error) {
      const div = document.createElement("div");
      div.className = "error";
      div.textContent = error.message;
      messagesEl.appendChild(div);
      scrollDown();
      setBusy(false);
      input.focus();
    }

    // ---------- Chat and approval ----------

    async function answerConfirmation(approved, actionsEl) {
      actionsEl.remove();
      addMessage(approved ? "Yes, continue" : "No", "user");
      try {
        showResult(await post("/approve", { thread_id: threadId, approved }));
      } catch (error) {
        showError(error);
      }
    }

    chatForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      messagesEl.querySelector(".hint")?.remove();
      addMessage(text, "user");
      setBusy(true);

      const bubble = addMessage("Thinking...", "bot");
      bubble.classList.add("thinking");
      let written = "";
      try {
        // no customer_id: the token says who you are
        const data = await streamChat(text, (piece) => {
          written += piece;
          bubble.classList.remove("thinking");
          bubble.innerHTML = formatReply(written);
          scrollDown();
        });
        if (data.status === "needs_confirmation") {
          bubble.remove();
          showResult(data);
        } else {
          // The final reply is the one to keep: it can differ from what streamed (e.g. a polite fallback)
          bubble.classList.remove("thinking");
          bubble.innerHTML = formatReply(data.reply);
          if (data.route) addRoute(bubble, data.route);
          scrollDown();
          setBusy(false);
          input.focus();
        }
      } catch (error) {
        bubble.remove();
        showError(error);
      }
    });

    document.getElementById("tickets").onclick = async () => {
      try {
        const { tickets } = await get("/tickets");
        if (!tickets.length) return addMessage("You have no support tickets.", "bot");
        const lines = tickets.map(t => `**${t.reference}** · ${t.category} · ${t.priority} priority · ${t.status}\n${t.summary}`);
        addMessage(`Your support tickets:\n\n${lines.join("\n\n")}`, "bot");
      } catch (error) {
        showError(error);
      }
    };

    function newChat() {
      threadId = crypto.randomUUID();
      remember("sb_thread", threadId);
      messagesEl.innerHTML = `<p class="hint">${HINT}</p>`;
      setBusy(false);
      input.focus();
    }

    document.getElementById("new-chat").onclick = newChat;

    // ---------- Page load: pick up where the customer left off ----------

    async function restoreSession() {
      if (!token) return;
      try {
        const saved = await get(`/history?thread_id=${encodeURIComponent(threadId)}`);   // a 401 here logs out
        showChat();
        remember("sb_thread", threadId);
        messagesEl.innerHTML = "";
        if (!saved.messages.length && !saved.pending_confirmation) {
          messagesEl.innerHTML = `<p class="hint">${HINT}</p>`;
        }
        for (const m of saved.messages) addMessage(m.content, m.role === "user" ? "user" : "bot");
        if (saved.pending_confirmation) addConfirmation(saved.pending_confirmation);
      } catch {
        // an expired login is handled in readJson; any other failure simply shows the login screen
        if (token) logout();
      }
    }

    restoreSession();
  </script>
</body>
</html>
