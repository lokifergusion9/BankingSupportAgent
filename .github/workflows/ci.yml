name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Same install as the Dockerfile: CPU-only PyTorch, then the pinned requirements
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest httpx

      # No API key and no model downloads needed: the tests use fakes for the LLM and the search
      - name: Run tests
        run: python -m pytest -q
        env:
          PYTHONPATH: src
