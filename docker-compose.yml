services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data          # bank.db, checkpoints.db and chroma_db live here
      - ./keys:/app/keys          # login keys, created on the first start
      - model-cache:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  model-cache:
